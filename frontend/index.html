<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CTU Bus Route Visualizer - View Chandigarh bus routes on an interactive map">
    <title>CTU Bus Routes - Chandigarh</title>
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <div id="sidebar-header">
                <h1>CTU Bus Routes</h1>
                <p>Chandigarh Transport Undertaking</p>
            </div>
            <div id="trip-planner">
                <div class="planner-field">
                    <label for="from-input">Current Location</label>
                    <input type="text" id="from-input" placeholder="Enter your stop..." autocomplete="off">
                    <div id="from-suggestions" class="suggestions hidden"></div>
                </div>
                <div class="planner-field">
                    <label for="to-input">Where do you want to go?</label>
                    <input type="text" id="to-input" placeholder="Enter destination stop..." autocomplete="off">
                    <div id="to-suggestions" class="suggestions hidden"></div>
                </div>
                <button id="plan-btn">Find Buses</button>
            </div>
            <div id="plan-results" class="hidden"></div>
        </div>
        <div id="map"></div>
        <div id="right-panel">
            <button id="panel-toggle" title="Toggle Routes">‹</button>
            <div id="panel-drag-handle"><span></span></div>
            <div id="panel-content">
                <div id="search-box">
                    <input type="text" id="search-input" placeholder="Search route no. or stop name..." autocomplete="off">
                    <button id="clear-btn" title="Clear">✕</button>
                </div>
                <div id="route-list"></div>
                <div id="route-detail" class="hidden">
                    <button id="back-btn">← Back to list</button>
                    <div id="detail-content"></div>
                </div>
            </div>
        </div>
        <button id="mobile-fab" title="View Routes">☰</button>
        <button id="mobile-back" class="hidden">← Back to Search</button>
        <button id="mobile-recenter" title="Re-center route">⊕</button>
        <div id="sheet-overlay"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js?v=8"></script>
</body>
</html>
